name: Bug report
description: Report a reproducible problem using synthetic or anonymized inputs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MacroFactor Workout Bridge. Never upload a real MacroFactor export, coach workbook, generated report, credential, or unredacted local path. Use the private Security Policy flow for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal example using synthetic or deliberately anonymized data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Apple silicon model family, Python version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real workout data, workbook content, credentials, account names, and machine-specific paths.
          required: true
        - label: This report does not contain vulnerability details that should be disclosed privately.
          required: true
