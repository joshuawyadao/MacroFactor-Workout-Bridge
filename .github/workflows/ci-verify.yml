name: CI Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    name: Python and Qt tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: |
            requirements/audit.lock
            requirements/test.lock

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install reviewed dependency-audit tooling
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement requirements/audit.lock

      - name: Audit locked Python dependencies
        run: |
          python -m pip_audit \
            --disable-pip \
            --require-hashes \
            --requirement requirements/audit.lock \
            --requirement requirements/app-build.lock \
            --requirement requirements/test.lock

      - name: Run complete test suite
        run: ./scripts/test.sh

      - name: Compile Python sources
        run: python -m compileall -q src tests packaging scripts

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
  packaged_app:
    name: macOS packaged app
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up reviewed build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.17"
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements/app-build.lock
      - name: Build, ad hoc sign, and verify packaged app
        env:
          PYTHON_BIN: python
        run: ./scripts/build_macos_app.sh
      - name: Smoke test embedded Qt runtime without personal data
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/MacroFactor Workout Bridge.app/Contents/MacOS/MacroFactor Workout Bridge" --smoke-test'
  verify:
    name: CI Verify
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    needs: [portable, packaged_app]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every platform check
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          PACKAGED_APP_RESULT: ${{ needs.packaged_app.result }}
        run: ./scripts/check_ci_results.sh
