[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrofactor-workout-bridge"
version = "0.2.0"
description = "Safely copy MacroFactor workout results into a coach Excel workbook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Wyadao" }]
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.7,<7"]
app-build = ["PySide6-Essentials>=6.7,<7", "pyinstaller>=6,<7"]

[project.scripts]
macrofactor-bridge = "macrofactor_bridge.cli:main"
macrofactor-workspace = "macrofactor_bridge.local_workspace:main"

[project.gui-scripts]
macrofactor-bridge-gui = "macrofactor_bridge.desktop:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
