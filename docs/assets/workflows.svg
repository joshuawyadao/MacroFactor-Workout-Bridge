<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Choose a MacroFactor Workout Bridge workflow</title>
  <desc id="desc">History: exercise logs and a coach workbook become a read-only Dashboard, with training notes saved explicitly. Part 1: logged sets go through preview to a new coach workbook copy. Part 2: a coach plan and direct program template go through gated preview to a candidate requiring manual MacroFactor import verification. Source files stay unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <style>text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;} .label {font-size:22px;font-weight:700;fill:#f8fafc;} .detail {font-size:17px;fill:#cbd5e1;} .step {font-size:20px;font-weight:600;fill:#f8fafc;} .line {stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow);}</style>
  </defs>
  <rect width="1120" height="540" rx="20" fill="#101820"/>
  <text x="34" y="46" fill="#f8fafc" font-size="27" font-weight="700">Your files. Three clear paths.</text>
  <text x="34" y="77" class="detail">Choose the task; review the result. Source files stay unchanged.</text>
  <rect x="24" y="102" width="1072" height="116" rx="12" fill="#1e293b"/>
  <rect x="24" y="102" width="5" height="116" rx="2" fill="#67e8f9"/>
  <text x="48" y="139" class="label">Review history</text>
  <text x="48" y="169" class="detail">Logs + coach workbook</text>
  <text x="48" y="193" class="detail">All-time exports help</text>
  <path d="M 335 157 H 381" class="line"/>
  <text x="407" y="151" class="step">Dashboard</text>
  <text x="407" y="181" class="detail">Trends · blocks · original sets</text>
  <path d="M 720 157 H 766" class="line"/>
  <text x="792" y="151" class="step">Private training notes</text>
  <text x="792" y="181" class="detail">Saved only when requested</text>
  <rect x="24" y="230" width="1072" height="116" rx="12" fill="#1e293b"/>
  <rect x="24" y="230" width="5" height="116" rx="2" fill="#c4b5fd"/>
  <text x="48" y="267" class="label">Transfer results · Part 1</text>
  <text x="48" y="297" class="detail">Logged sets + coach week</text>
  <text x="48" y="321" class="detail">Exact exercise mappings</text>
  <path d="M 335 285 H 381" class="line"/>
  <text x="407" y="279" class="step">Preview changes</text>
  <text x="407" y="309" class="detail">Inspect proposed cells + warnings</text>
  <path d="M 720 285 H 766" class="line"/>
  <text x="792" y="279" class="step">New coach workbook</text>
  <text x="792" y="309" class="detail">Save a separate .xlsx copy</text>
  <rect x="24" y="358" width="1072" height="116" rx="12" fill="#1e293b"/>
  <rect x="24" y="358" width="5" height="116" rx="2" fill="#fcd34d"/>
  <text x="48" y="395" class="label">Generate program · Part 2</text>
  <text x="48" y="425" class="detail">Coach plan + direct template</text>
  <text x="48" y="449" class="detail">Advanced CLI workflow</text>
  <path d="M 335 413 H 381" class="line"/>
  <text x="407" y="407" class="step">Gated preview → candidate</text>
  <text x="407" y="437" class="detail">Resolve blockers before generation</text>
  <path d="M 720 413 H 766" class="line"/>
  <text x="792" y="407" class="step">Manual import check</text>
  <text x="792" y="437" class="detail">Verify inside MacroFactor</text>
  <text x="34" y="514" class="detail">Local processing · New output paths · No automatic MacroFactor import</text>
</svg>
